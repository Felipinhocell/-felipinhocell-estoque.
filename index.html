<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>FelipinhoCell Estoque</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial;background:#f3f6fa;color:#122033}header{background:linear-gradient(135deg,#07111f,#0868ba);color:#fff;padding:28px 17px 22px;border-radius:0 0 26px 26px}h1{margin:0}main{max-width:850px;margin:auto;padding:14px}.box,.card{background:#fff;border-radius:18px;padding:14px;margin:11px 0;box-shadow:0 4px 18px #0001}textarea,input,button{font:inherit;width:100%;border-radius:12px;padding:12px}textarea,input{border:1px solid #dbe2ea;background:#fff}textarea{height:260px;font-size:16px}button{border:0;background:#1689ff;color:#fff;font-weight:800;margin-top:8px}.green{background:#118b57}.red{background:#c62828}.dark{background:#07111f}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint,.meta{font-size:12px;color:#6b7788}.preview{font-size:13px;line-height:1.55;background:#f5f8fb;border-radius:12px;padding:10px;margin-top:9px;display:none}.name{font-size:17px;font-weight:900}.price{font-size:21px;font-weight:900;color:#13915a;margin-top:6px}.badge{display:inline-block;font-size:11px;font-weight:800;background:#eaf4ff;color:#076bc9;padding:4px 7px;border-radius:20px;margin:3px 3px 0 0}@media(max-width:520px){.row{grid-template-columns:1fr}}
</style></head><body>
<header><h1>📱 FelipinhoCell</h1><p>Lista do fornecedor + R$ 600 automaticamente</p></header>
<main>
<div class="box"><b>📋 COLE A NOVA LISTA DO FORNECEDOR</b><p class="hint">Aceita o formato antigo e também: IPHONE 16 128GB → BRANCO $4.239,00 → AZUL $4.139,00.</p>
<textarea id="raw" placeholder="COLE A LISTA COMPLETA AQUI"></textarea>
<button id="analisar">🔎 ANALISAR LISTA</button>
<div class="row"><button class="green" id="substituir">🔄 SUBSTITUIR PELA NOVA LISTA</button><button class="red" id="excluir">🗑️ EXCLUIR LISTA ATUAL</button></div>
<div id="preview" class="preview"></div></div>
<div class="box"><b>💰 Margem por aparelho</b><input id="margin" type="number" value="600"><button class="dark" id="copiar">📲 COPIAR TABELA PARA WHATSAPP</button></div>
<input id="search" placeholder="🔎 Pesquisar iPhone..."><div id="list"></div>
</main>
<script>
(function(){
var $=function(id){return document.getElementById(id)}, temp=[], items=[];
try{items=JSON.parse(localStorage.getItem("fc_v6")||localStorage.getItem("fc_v5")||localStorage.getItem("fc_v4")||"[]")}catch(e){items=[]}
function money(n){return Number(n).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function val(s){s=(s||"").replace(/[^\d.,]/g,"");if(s.indexOf(",")>-1)return parseFloat(s.replace(/\./g,"").replace(",","."));if(/\.\d{3}$/.test(s))return parseFloat(s.replace(/\./g,""));return parseFloat(s)}
function cleanColor(s){return (s||"").replace(/[^\p{L}\s]/gu," ").replace(/\s+/g," ").trim().toUpperCase()}
function parse(){
 var lines=$("raw").value.split(/\r?\n/).map(function(x){return x.trim()}).filter(Boolean), out=[], model=null, storage="", usa=false, battery="Consultar";
 lines.forEach(function(line){
   var mm=line.match(/iphone\s*(\d{1,2}(?:e)?)\s*(pro\s*max|pro|plus)?\s*(\d{2,4})?\s*gb?/i);
   if(mm){
     model=("iPhone "+mm[1]+" "+(mm[2]||"")).replace(/\s+/g," ").trim();
     storage=mm[3]?mm[3]+" GB":"Consultar"; usa=/americano|🇺🇸/i.test(line); battery="Consultar"; return;
   }
   if(!model)return;
   if(/americano|🇺🇸/i.test(line))usa=true;
   var bat=line.match(/(acima de\s*)?(\d{2,3})%/i); if(bat){battery=(bat[1]?"Acima de ":"")+bat[2]+"%";return;}
   var price=line.match(/(?:R?\$|💸|💰|💵)\s*([\d.]+(?:,\d{1,2})?)/i);
   if(price){
      var cost=val(price[1]);
      var before=line.substring(0,price.index);
      var color=cleanColor(before);
      color=color.replace(/\b(R|RS)\b/g,"").trim();
      if(!color || /FONTE|CABO|CARREGADOR/.test(color)) color="Consultar";
      out.push({name:model,storage:storage,color:color,cost:cost,battery:battery,usa:usa});
   }
 });
 // fallback for old format: price-only line followed/preceded by color lines
 if(!out.length){
   model=null;storage="";usa=false;battery="Consultar";var pendingColors=[],cost=0;
   function flush(){if(model&&cost){out.push({name:model,storage:storage,color:pendingColors.length?pendingColors.join(", "):"Consultar",cost:cost,battery:battery,usa:usa})}}
   lines.forEach(function(line){
     var mm=line.match(/iphone\s*(\d{1,2}(?:e)?)\s*(pro\s*max|pro|plus)?\s*(\d{2,4})?\s*gb?/i);
     if(mm){flush();model=("iPhone "+mm[1]+" "+(mm[2]||"")).replace(/\s+/g," ").trim();storage=mm[3]?mm[3]+" GB":"Consultar";pendingColors=[];cost=0;usa=/americano|🇺🇸/i.test(line);battery="Consultar";return}
     if(!model)return;
     var pr=line.match(/[💸💰💵]\s*([\d.,]+)/);if(pr){cost=val(pr[1]);return}
     var bt=line.match(/(acima de\s*)?(\d{2,3})%/i);if(bt){battery=(bt[1]?"Acima de ":"")+bt[2]+"%";return}
     var cm=line.match(/(azul|verde|branco|preto|gold|dourado|roxo|rosa|roza|lil[aá]s|natural|desert)/i);if(cm)pendingColors.push(cm[1].toUpperCase().replace("ROZA","ROSA"));
   });flush();
 }
 return out;
}
function analisar(){temp=parse();var p=$("preview");p.style.display="block";p.innerHTML=temp.length?"<b>✅ "+temp.length+" opções encontradas</b><br><br>"+temp.slice(0,40).map(function(x){return x.name+" "+x.storage+" • "+x.color+" • "+money(x.cost)+" → <b>"+money(x.cost+(Number($("margin").value)||600))+"</b>"}).join("<br>"):"⚠️ Nenhum aparelho encontrado. Se isso acontecer, envie um print das primeiras linhas da lista."}
function render(){var q=$("search").value.toLowerCase(),m=Number($("margin").value)||600;$("list").innerHTML=items.filter(function(x){return JSON.stringify(x).toLowerCase().indexOf(q)>-1}).map(function(x){return '<div class="card"><div class="name">'+x.name+' • '+x.storage+'</div>'+(x.usa?'<span class="badge">🇺🇸 AMERICANO</span>':'')+'<span class="badge">🎨 '+x.color+'</span><div class="meta">Custo: '+money(x.cost)+' + '+money(m)+'</div><div class="price">Venda: '+money(x.cost+m)+'</div></div>'}).join("")}
function substituir(){temp=parse();if(!temp.length){analisar();return}if(!confirm("Substituir toda a lista atual por "+temp.length+" opções?"))return;items=temp;localStorage.setItem("fc_v6",JSON.stringify(items));render();alert("Lista substituída com sucesso!")}
function excluir(){if(!confirm("Excluir toda a lista atual?"))return;items=[];temp=[];localStorage.setItem("fc_v6","[]");$("raw").value="";$("preview").style.display="none";render();alert("Lista excluída!")}
function copiar(){var m=Number($("margin").value)||600,t="📱 *OFERTAS FELIPINHOCELL* 📱\n\n";items.forEach(function(x){t+="📱 *"+x.name+" "+x.storage+"*\n🎨 "+x.color+"\n💰 *"+money(x.cost+m)+"*\n\n"});if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){alert("Tabela copiada!")});else prompt("Copie:",t)}
$("analisar").onclick=analisar;$("substituir").onclick=substituir;$("excluir").onclick=excluir;$("copiar").onclick=copiar;$("margin").oninput=render;$("search").oninput=render;render();
})();
</script></body></html>
